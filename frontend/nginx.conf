server {
    listen 8080;
    server_name _;

    # Answers by itself, so the frontend pod's probe does not depend on the backend
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        root /usr/share/nginx/html;
        expires 5m;
    }

    # Everything else goes to the backend Service (DNS name "backend")
    location / {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Frontend-Pod $hostname;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}

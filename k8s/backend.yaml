# Backend: Flask + SQLite. One replica because the SQLite file lives inside the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifelog-backend
  labels:
    app: lifelog-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lifelog-backend
  template:
    metadata:
      labels:
        app: lifelog-backend
    spec:
      containers:
        - name: backend
          image: saksham122004/lifelog-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            # Downward API: the footer shows which pod served the request
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
# Internal only: nginx reaches it as http://backend:5000
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: lifelog-backend
  ports:
    - port: 5000
      targetPort: 5000

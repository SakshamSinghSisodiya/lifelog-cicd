apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifelog
  labels:
    app: lifelog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lifelog
  template:
    metadata:
      labels:
        app: lifelog
    spec:
      containers:
        - name: lifelog
          image: saksham122004/lifelog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            # Downward API: the footer shows which pod served the request
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

# Frontend: nginx serving static files and proxying to the backend. Stateless, so 2 replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifelog-frontend
  labels:
    app: lifelog-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lifelog-frontend
  template:
    metadata:
      labels:
        app: lifelog-frontend
    spec:
      containers:
        - name: frontend
          image: saksham122004/lifelog-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
# The only public entry point: NodePort 30080
apiVersion: v1
kind: Service
metadata:
  name: lifelog
spec:
  type: NodePort
  selector:
    app: lifelog-frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
